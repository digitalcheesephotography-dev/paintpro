<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaintPro Measure</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2baae1;--green:#2e8b1e;--red:#c0392b;--amber:#f59e0b;
  --dark:#0d1117;--panel:#161b22;--card:#1a2030;--border:#252c3a;
  --text:#e2e8f0;--muted:#8a9bb0;--tap:54px;--r:12px;
  --head:'Bebas Neue','Arial Narrow',sans-serif;
  --font:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--dark);color:var(--text);font-family:var(--font);font-size:19px}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button,input,textarea{font-family:var(--font);font-size:20px;color:var(--text)}
button{cursor:pointer}

/* top bar */
#bar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:2px solid var(--border);padding:8px 12px calc(6px)}
.bar-row{display:flex;gap:8px;align-items:center}
#btBtn{flex:0 0 auto;min-height:46px;padding:0 14px;border-radius:10px;border:2px solid var(--blue);background:transparent;font-weight:700}
#btBtn.ok{background:var(--green);border-color:var(--green)}
#btBtn.busy{border-color:var(--amber);color:var(--amber)}
#btBtn.err{border-color:var(--red);color:#ff8d80}
#last{flex:1;text-align:center;font-family:var(--head);font-size:34px;letter-spacing:1px;line-height:1;color:var(--blue)}
#muteBtn{flex:0 0 46px;min-height:46px;border-radius:10px;border:2px solid var(--border);background:transparent;padding:0}
.bar-row2{display:flex;justify-content:space-between;font-size:16px;color:var(--muted);margin-top:4px}
#saveInd{color:#5ad06a;font-weight:600}
#saveInd.bad{color:#ff6b5b}
#saveInd.flash{animation:fl .6s}
@keyframes fl{from{background:#2e8b1e66}to{background:transparent}}

#app{max-width:760px;margin:0 auto;padding:12px}
h1{font-family:var(--head);font-size:40px;letter-spacing:1.5px;margin:6px 0 10px;color:var(--blue);font-weight:400}
h2{font-family:var(--head);font-size:28px;letter-spacing:1px;margin:18px 0 8px;font-weight:400}
.muted{color:var(--muted)}
.back{background:none;border:none;color:var(--blue);padding:8px 0;min-height:44px;font-size:20px;font-weight:600}

.big{width:100%;min-height:var(--tap);border-radius:var(--r);border:2px solid var(--border);background:var(--card);font-weight:700;margin:6px 0}
.big.primary{background:var(--blue);border-color:var(--blue);color:#06202d}
.big.green{background:var(--green);border-color:var(--green)}
.big.danger{border-color:var(--red);color:#ff8d80;background:transparent}
.btn{min-height:46px;padding:0 14px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-weight:600}
.btn.blue{border-color:var(--blue);color:var(--blue);background:transparent}
.btn.sm{min-height:40px;padding:0 10px;font-size:17px}
input[type=text],input.num,textarea{background:var(--dark);border:2px solid var(--border);border-radius:10px;padding:8px 10px;min-height:46px}
input.num{width:84px;text-align:center}
input.name{width:100%;font-size:26px;font-weight:700}
textarea{width:100%;min-height:90px}

.card{background:var(--panel);border:2px solid var(--border);border-radius:var(--r);padding:12px;margin:10px 0}
.job,.roomrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--border);border-radius:var(--r);padding:12px;margin:8px 0;min-height:var(--tap);cursor:pointer}
.job .t,.roomrow .t{flex:1;font-weight:700;font-size:22px}
.job .s,.roomrow .s{font-size:16px;color:var(--muted);font-weight:500}
.dot{width:16px;height:16px;border-radius:50%;background:#3a4354;flex:0 0 16px}
.dot.s-wip{background:var(--amber)}.dot.s-done{background:#3fbf4f}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chipbtn{min-height:46px;padding:0 14px;border-radius:999px;border:2px solid var(--blue);background:transparent;color:var(--blue);font-weight:700}

.roomtop{display:flex;gap:8px;align-items:center}
.done{flex:0 0 auto;min-height:46px;padding:0 12px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-weight:700}
.done.on{background:var(--green);border-color:var(--green)}
.sumstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.sumstrip div{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 2px;text-align:center;font-size:14px;color:var(--muted);line-height:1.15}
.sumstrip b{display:block;font-size:22px;color:var(--text);font-family:var(--head);font-weight:400;letter-spacing:.5px}

.sec{background:var(--panel);border:2px solid var(--border);border-radius:var(--r);margin:10px 0;overflow:hidden}
.sec.active{border-color:var(--blue);box-shadow:0 0 0 2px #2baae144}
.sec-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);flex-wrap:wrap}
.sec-title{font-family:var(--head);font-size:26px;letter-spacing:1px}
.sec-total{margin-left:auto;font-weight:700;color:var(--text)}
.tag{flex-basis:100%;font-size:15px;color:var(--muted)}
.sec.active .tag{color:var(--blue);font-weight:700}
.sec-body{padding:10px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.item{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px 6px}
.item .x{background:none;border:none;color:#ff8d80;min-width:40px;min-height:40px;padding:0;font-size:22px}
.item .n{color:var(--muted);font-size:15px;min-width:18px}
.times{color:var(--muted)}
.counter{display:flex;align-items:center;gap:10px;margin:8px 0}
.counter .lbl{flex:1;font-weight:700;font-size:22px}
.counter button{width:56px;min-height:56px;border-radius:12px;border:2px solid var(--border);background:var(--card);font-size:30px;font-weight:700;padding:0}
.counter .val{min-width:44px;text-align:center;font-family:var(--head);font-size:40px}
.hint{font-size:16px;color:var(--muted)}
.pend{color:var(--amber);font-weight:700;margin:6px 0}

#bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:2px solid var(--border);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:none}
#bottom .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
#bottom button{flex:1;min-height:var(--tap);border-radius:var(--r);font-weight:700;border:2px solid var(--border);background:var(--card)}
#bottom .go{background:var(--green);border-color:var(--green)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));max-width:90%;background:#222a3a;border:2px solid var(--blue);border-radius:12px;padding:10px 14px;font-weight:600;z-index:50;display:none;text-align:center}
#toast.warn{border-color:var(--amber)}#toast.err{border-color:var(--red)}
.foot{margin:24px 0 8px;font-size:16px;color:var(--muted)}
@media (max-width:430px){ body{font-size:18px} .sumstrip b{font-size:20px} .sec-title{font-size:24px} }
</style>
</head>
<body>
<div id="bar">
  <div class="bar-row">
    <button id="btBtn" onclick="handleBt()">📐 Connect DISTO</button>
    <div id="last">- ft</div>
    <button id="muteBtn" onclick="toggleMute()" aria-label="Sound on or off">🔊</button>
  </div>
  <div class="bar-row2"><span id="btStatus">DISTO not connected</span><span id="saveInd">Saved ✓</span></div>
</div>
<div id="app"></div>
<div id="bottom"><div class="in">
  <button onclick="undoShot()">↶ Undo last shot</button>
  <button class="go" onclick="doneRoom()">✓ Done with room</button>
</div></div>
<div id="toast"></div>

<script>
'use strict';
// ───────────────────────── storage ─────────────────────────
var KEY = 'ppm_data_v1', BAK = 'ppm_data_bak_v1';
var state = { v:1, jobs:[], view:'home', jobId:null, roomId:null, target:'walls', mute:false };
var ui = { addingRoom:false };
var undoStack = [];

function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function sum(a){ return a.reduce(function(x,y){return x+y;},0); }
function fmt(n){ n = Math.round(n*10)/10; return String(n); }
function nowTime(){ return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'}); }
function dateStr(ts){ return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

function load(){
  var raw = null, restored = false;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  var parsed = null;
  try { parsed = raw ? JSON.parse(raw) : null; } catch(e){ parsed = null; }
  if (!parsed && raw) { // main copy is damaged, try the previous save
    try { parsed = JSON.parse(localStorage.getItem(BAK)); restored = !!parsed; } catch(e){}
  }
  if (parsed && Array.isArray(parsed.jobs)) {
    state = Object.assign(state, parsed);
    if (restored) setTimeout(function(){ toast('Main save was damaged. Restored the previous save.','warn'); },400);
  }
}

function save(){
  var ind = document.getElementById('saveInd');
  try {
    var str = JSON.stringify(state);
    localStorage.setItem(KEY, str);
    if (localStorage.getItem(KEY) !== str) throw new Error('verify failed');
    localStorage.setItem(BAK, str); // second copy, written only after the main copy verified
    ind.textContent = 'Saved ✓ ' + nowTime();
    ind.className = ''; void ind.offsetWidth; ind.className = 'flash';
    return true;
  } catch(e) {
    ind.textContent = 'NOT SAVED - tap Backup now';
    ind.className = 'bad';
    toast('Could not save. Use Backup to download your numbers.','err');
    return false;
  }
}

// ───────────────────────── helpers ─────────────────────────
function curJob(){ return state.jobs.find(function(j){return j.id===state.jobId;}) || null; }
function curRoom(){ var j=curJob(); return j ? (j.rooms.find(function(r){return r.id===state.roomId;})||null) : null; }
function touch(){ var j=curJob(); if(j) j.updated = Date.now(); }
function commit(rerender){ touch(); save(); if(rerender) render(); else updateTotals(); }

// "12", "12.5", "12'6" -> feet as a number, or null
function parseFt(v){
  v = String(v==null?'':v).trim().replace(/[”"]/g,'');
  var m = v.match(/^(\d+(?:\.\d+)?)\s*['’]\s*(\d+(?:\.\d+)?)?$/);
  if (m) return Math.round((parseFloat(m[1]) + (parseFloat(m[2]||0)/12))*10)/10;
  var n = parseFloat(v);
  if (!isFinite(n) || n < 0) return null;
  return Math.round(n*10)/10;
}

function roomTotals(r){
  var per = sum(r.walls);
  return {
    per: per,
    wallSF: per * (r.height||0),
    ceilSF: r.ceil.reduce(function(a,c){return a + c.l*c.w;},0),
    baseLF: sum(r.base),
    doors: r.doors||0, wins: r.wins||0
  };
}
function roomStatus(r){
  if (r.done) return 'done';
  return (r.walls.length||r.ceil.length||r.base.length||r.doors||r.wins) ? 'wip' : 'empty';
}

var toastT=null;
function toast(msg,kind){
  var t=document.getElementById('toast'); t.textContent=msg; t.className=kind||''; t.style.display='block';
  clearTimeout(toastT); toastT=setTimeout(function(){t.style.display='none';},2600);
}

// ───────────────────────── navigation ─────────────────────────
function goHome(){ state.view='home'; state.jobId=null; state.roomId=null; undoStack=[]; save(); render(); window.scrollTo(0,0); }
function openJob(id){ state.view='job'; state.jobId=id; state.roomId=null; ui.addingRoom=false; undoStack=[]; save(); render(); window.scrollTo(0,0); }
function openRoom(id){ state.view='room'; state.roomId=id; state.target='walls'; undoStack=[]; save(); render(); window.scrollTo(0,0); }
function newJob(){
  var j = { id:uid('j'), client:'', created:Date.now(), updated:Date.now(), lastHeight:8, rooms:[] };
  state.jobs.push(j); openJob(j.id);
}
function addRoom(name){
  var j=curJob(); if(!j) return;
  var base = name || 'Room', n = j.rooms.filter(function(r){return r.name===base||r.name.indexOf(base+' ')===0;}).length;
  var r = { id:uid('r'), name: n ? base+' '+(n+1) : base, height:j.lastHeight||8, walls:[], ceil:[], ceilPending:null, base:[], doors:0, wins:0, notes:'', done:false };
  j.rooms.push(r); ui.addingRoom=false; touch(); openRoom(r.id);
}
function doneRoom(){ var r=curRoom(); if(r){ r.done=true; } touch(); save(); openJob(state.jobId); toast('Room marked done ✓'); }
function toggleDone(){ var r=curRoom(); r.done=!r.done; commit(true); }
function deleteRoom(){ if(!confirm('Delete this room and all its numbers?')) return; var j=curJob(); j.rooms=j.rooms.filter(function(r){return r.id!==state.roomId;}); touch(); openJob(j.id); }
function deleteJob(){ if(!confirm('Delete this whole job? Download a backup first if unsure.')) return; state.jobs=state.jobs.filter(function(j){return j.id!==state.jobId;}); goHome(); }

// ───────────────────────── shot targets ─────────────────────────
function setTarget(key){
  state.target = key;
  document.querySelectorAll('.sec[data-key]').forEach(function(el){
    var on = el.dataset.key===key;
    el.classList.toggle('active',on);
    var tg = el.querySelector('.tag'); if(tg) tg.textContent = on ? '● DISTO fills this' : 'tap to select';
  });
  save();
}

function onShot(feetRaw){
  var ft = Math.round(feetRaw);
  if (!(ft > 0)) { toast('Reading too small','warn'); return; }
  document.getElementById('last').textContent = ft + " ft";
  speak(ft);
  var r = curRoom();
  if (state.view !== 'room' || !r) { toast('Shot ' + ft + ' ft was NOT saved. Open a room first.','warn'); return; }
  var msg='';
  if (state.target==='height') {
    var prevH=r.height, prevT='height', j=curJob(), prevLH=j.lastHeight;
    r.height=ft; j.lastHeight=ft; state.target='walls';
    undoStack.push(function(){ r.height=prevH; j.lastHeight=prevLH; state.target=prevT; });
    msg='Ceiling height ' + ft + ' ft';
  } else if (state.target==='ceil') {
    if (r.ceilPending==null) {
      r.ceilPending = ft;
      undoStack.push(function(){ r.ceilPending=null; });
      msg='Ceiling length ' + ft + '. Now shoot the width.';
    } else {
      var l=r.ceilPending; r.ceil.push({l:l,w:ft}); r.ceilPending=null;
      undoStack.push(function(){ r.ceil.pop(); r.ceilPending=l; });
      msg='Ceiling ' + l + ' x ' + ft + ' = ' + (l*ft) + ' sf';
    }
  } else if (state.target==='base') {
    r.base.push(ft); undoStack.push(function(){ r.base.pop(); });
    msg='Baseboard run ' + ft + ' ft';
  } else {
    r.walls.push(ft); undoStack.push(function(){ r.walls.pop(); });
    msg='Wall ' + r.walls.length + ': ' + ft + ' ft';
  }
  commit(true);
  toast(msg + '  ✓ Saved');
}
function undoShot(){
  var fn = undoStack.pop();
  if (!fn) { toast('Nothing to undo','warn'); return; }
  fn(); commit(true); toast('Undone');
}

// ───────────────────────── edits ─────────────────────────
function renameRoom(v){ var r=curRoom(); if(!v.trim()) return; r.name = v.trim(); commit(false); }
function renameClient(v){ var j=curJob(); j.client = v.trim(); commit(false); }
function setNotes(v){ var r=curRoom(); r.notes=v; commit(false); }
function setHeight(el){ var r=curRoom(), n=parseFt(el.value); if(n==null||n===0){ el.value=r.height; return; } r.height=n; curJob().lastHeight=n; commit(false); }
function editList(key,i,el){ var r=curRoom(), n=parseFt(el.value); if(n==null){ el.value=r[key][i]; return; } r[key][i]=n; commit(false); }
function delList(key,i){ var r=curRoom(); var removed=r[key].splice(i,1); commit(true); }
function addList(key,inputId){
  var el=document.getElementById(inputId), n=parseFt(el.value);
  if(n==null||n===0){ toast('Type a number first','warn'); return; }
  curRoom()[key].push(n); commit(true);
  var again=document.getElementById(inputId); if(again) again.focus();
}
function editCeil(i,which,el){ var r=curRoom(), n=parseFt(el.value); if(n==null){ el.value=r.ceil[i][which]; return; } r.ceil[i][which]=n; commit(false); }
function delCeil(i){ curRoom().ceil.splice(i,1); commit(true); }
function addCeil(){
  var l=parseFt(document.getElementById('cL').value), w=parseFt(document.getElementById('cW').value);
  if(!l||!w){ toast('Type length and width','warn'); return; }
  curRoom().ceil.push({l:l,w:w}); commit(true);
}
function ceilFromWalls(){
  var r=curRoom(); if(r.walls.length<2){ toast('Measure at least 2 walls first','warn'); return; }
  r.ceil.push({l:r.walls[0],w:r.walls[1]}); commit(true); toast('Ceiling = wall 1 x wall 2. Edit if the room is not a rectangle.');
}
function basePerimeter(){
  var r=curRoom(), p=sum(r.walls); if(!p){ toast('Measure the walls first','warn'); return; }
  r.base.push(Math.round(p*10)/10); commit(true);
}
function bump(key,d){
  var r=curRoom(); r[key]=Math.max(0,(r[key]||0)+d);
  document.getElementById('n_'+key).textContent=r[key]; commit(false);
}

// ───────────────────────── rendering ─────────────────────────
function updateTotals(){
  var r=curRoom(); if(!r||state.view!=='room') return;
  var t=roomTotals(r);
  function set(id,txt){ var e=document.getElementById(id); if(e) e.textContent=txt; }
  set('sum_walls',fmt(t.wallSF)); set('sum_ceil',fmt(t.ceilSF)); set('sum_base',fmt(t.baseLF));
  set('sum_doors',t.doors); set('sum_wins',t.wins);
  set('tot_walls', fmt(t.per)+' ft around · '+fmt(t.wallSF)+' sf');
  set('tot_ceil', fmt(t.ceilSF)+' sf'); set('tot_base', fmt(t.baseLF)+' lf');
  set('tot_dw', t.doors+' doors · '+t.wins+' windows');
  set('btnPerim','Add perimeter ('+fmt(t.per)+' ft) as one run');
}

function render(){
  var app=document.getElementById('app'), bottom=document.getElementById('bottom');
  var j=curJob(), r=curRoom();
  if (state.view==='room' && j && r) { app.innerHTML=roomHtml(j,r); bottom.style.display='block'; }
  else if (state.view==='job' && j) { app.innerHTML=jobHtml(j); bottom.style.display='none'; }
  else { state.view='home'; app.innerHTML=homeHtml(); bottom.style.display='none'; }
  document.getElementById('muteBtn').textContent = state.mute ? '🔇' : '🔊';
}

function homeHtml(){
  var jobs=state.jobs.slice().sort(function(a,b){return b.updated-a.updated;});
  var h='<h1>PaintPro Measure</h1><button class="big primary" onclick="newJob()">+ New Job</button>';
  if(!jobs.length) h+='<p class="muted">No jobs yet. Tap New Job, connect the DISTO, and start measuring.</p>';
  jobs.forEach(function(j){
    h+='<div class="job" onclick="openJob(\''+j.id+'\')"><div class="t">'+esc(j.client||'Untitled job')+'<div class="s">'+j.rooms.length+' room'+(j.rooms.length===1?'':'s')+' · '+dateStr(j.updated)+'</div></div><div>›</div></div>';
  });
  h+='<div class="foot">Safety</div>'+
     '<button class="big" onclick="backupAll()">⬇ Backup all jobs (file)</button>'+
     '<label class="big" style="display:flex;align-items:center;justify-content:center;border:2px solid var(--border);border-radius:var(--r);background:var(--card);font-weight:700">⬆ Restore from backup file<input type="file" accept=".json,application/json" style="display:none" onchange="restoreFile(this)"></label>';
  return h;
}

function jobHtml(j){
  var h='<button class="back" onclick="goHome()">← All jobs</button>'+
    '<input type="text" id="clientIn" class="name" placeholder="Client name" value="'+esc(j.client)+'" oninput="renameClient(this.value)">'+
    '<h2>Rooms</h2>';
  if(!j.rooms.length) h+='<p class="muted">No rooms yet.</p>';
  j.rooms.forEach(function(r){
    var t=roomTotals(r), st=roomStatus(r);
    var s = st==='empty' ? 'Nothing measured yet' : 'Walls '+fmt(t.wallSF)+' sf · Ceiling '+fmt(t.ceilSF)+' sf · Base '+fmt(t.baseLF)+' lf';
    h+='<div class="roomrow" onclick="openRoom(\''+r.id+'\')"><div class="dot s-'+st+'"></div><div class="t">'+esc(r.name)+'<div class="s">'+s+'</div></div><div>›</div></div>';
  });
  if(ui.addingRoom){
    h+='<div class="card"><div class="muted">Pick a room:</div><div class="chips">';
    ['Kitchen','Living Room','Dining Room','Bedroom','Bathroom','Hallway','Office','Basement','Laundry','Entry','Closet','Garage'].forEach(function(n){
      h+='<button class="chipbtn" onclick="addRoom(\''+n+'\')">'+n+'</button>';
    });
    h+='<button class="chipbtn" onclick="addRoom(\'\')">Other</button></div><button class="btn" onclick="ui.addingRoom=false;render()">Cancel</button></div>';
  } else {
    h+='<button class="big primary" onclick="ui.addingRoom=true;render()">+ Add Room</button>';
  }
  var T={wallSF:0,ceilSF:0,baseLF:0,doors:0,wins:0};
  j.rooms.forEach(function(r){ var t=roomTotals(r); T.wallSF+=t.wallSF;T.ceilSF+=t.ceilSF;T.baseLF+=t.baseLF;T.doors+=t.doors;T.wins+=t.wins; });
  h+='<h2>Job totals</h2><div class="card">Walls <b>'+fmt(T.wallSF)+' sf</b> · Ceilings <b>'+fmt(T.ceilSF)+' sf</b> · Baseboard <b>'+fmt(T.baseLF)+' lf</b> · Doors <b>'+T.doors+'</b> · Windows <b>'+T.wins+'</b></div>'+
    '<h2>Send it</h2>'+
    '<button class="big primary" onclick="sendToClaude()">📤 Send to Claude</button>'+
    '<div class="row"><button class="btn" style="flex:1" onclick="copyExport()">Copy text</button><button class="btn" style="flex:1" onclick="saveTxt()">Save .txt</button><button class="btn" style="flex:1" onclick="backupJob()">Backup</button></div>'+
    '<div class="foot"><button class="btn sm" style="border-color:var(--red);color:#ff8d80" onclick="deleteJob()">Delete this job</button></div>';
  return h;
}

function roomHtml(j,r){
  var t=roomTotals(r), a=state.target;
  function sec(key,title,totId,totTxt,inner){
    return '<div class="sec'+(a===key?' active':'')+'" data-key="'+key+'"><div class="sec-head"><span class="sec-title">'+title+'</span><span class="sec-total" id="'+totId+'">'+totTxt+'</span><span class="tag">'+(a===key?'● DISTO fills this':'tap to select')+'</span></div><div class="sec-body">'+inner+'</div></div>';
  }
  function items(key,list){
    return list.map(function(v,i){
      return '<div class="item"><span class="n">'+(i+1)+'</span><input class="num" type="text" inputmode="decimal" value="'+v+'" onchange="editList(\''+key+'\','+i+',this)"><span class="times">ft</span><button class="x" onclick="delList(\''+key+'\','+i+')" aria-label="Delete">✕</button></div>';
    }).join('');
  }
  var h='<button class="back" onclick="openJob(\''+j.id+'\')">← '+esc(j.client||'Rooms')+'</button>'+
    '<div class="roomtop"><input type="text" class="name" value="'+esc(r.name)+'" oninput="renameRoom(this.value)"><button class="done'+(r.done?' on':'')+'" onclick="toggleDone()">'+(r.done?'✓ DONE':'Mark done')+'</button></div>'+
    '<div class="sumstrip"><div><b id="sum_walls">'+fmt(t.wallSF)+'</b>wall sf</div><div><b id="sum_ceil">'+fmt(t.ceilSF)+'</b>ceiling sf</div><div><b id="sum_base">'+fmt(t.baseLF)+'</b>base lf</div><div><b id="sum_doors">'+t.doors+'</b>doors</div><div><b id="sum_wins">'+t.wins+'</b>windows</div></div>';

  h+=sec('height','Ceiling height','tot_h',r.height+' ft',
    '<div class="row"><input class="num" type="text" inputmode="decimal" value="'+r.height+'" onchange="setHeight(this)"> <span class="times">ft</span> <span class="hint">Tap this card, then shoot the height.</span></div>');

  h+=sec('walls','Walls','tot_walls',fmt(t.per)+' ft around · '+fmt(t.wallSF)+' sf',
    '<div class="hint">Shoot each wall. Every shot adds a wall.</div><div class="row">'+items('walls',r.walls)+'</div>'+
    '<div class="row"><input class="num" id="wallAdd" type="text" inputmode="decimal" placeholder="ft"><button class="btn blue" onclick="addList(\'walls\',\'wallAdd\')">+ Add wall by hand</button></div>');

  var pend = r.ceilPending!=null ? '<div class="pend">Length '+r.ceilPending+' ft taken. Shoot the width.</div>' : '';
  var cits = r.ceil.map(function(c,i){
    return '<div class="item"><input class="num" type="text" inputmode="decimal" value="'+c.l+'" onchange="editCeil('+i+',\'l\',this)"><span class="times">×</span><input class="num" type="text" inputmode="decimal" value="'+c.w+'" onchange="editCeil('+i+',\'w\',this)"><button class="x" onclick="delCeil('+i+')" aria-label="Delete">✕</button></div>';
  }).join('');
  h+=sec('ceil','Ceiling','tot_ceil',fmt(t.ceilSF)+' sf',
    '<div class="hint">Shoot length, then width. For an L-shaped room add a second box.</div>'+pend+'<div class="row">'+cits+'</div>'+
    '<div class="row"><button class="btn blue" onclick="ceilFromWalls()">Use wall 1 × wall 2</button></div>'+
    '<div class="row"><input class="num" id="cL" type="text" inputmode="decimal" placeholder="L"><span class="times">×</span><input class="num" id="cW" type="text" inputmode="decimal" placeholder="W"><button class="btn blue" onclick="addCeil()">+ Add by hand</button></div>');

  h+=sec('base','Baseboard','tot_base',fmt(t.baseLF)+' lf',
    '<div class="hint">Shoot each run, or take the whole perimeter.</div><div class="row">'+items('base',r.base)+'</div>'+
    '<div class="row"><button class="btn blue" id="btnPerim" onclick="basePerimeter()">Add perimeter ('+fmt(t.per)+' ft) as one run</button></div>'+
    '<div class="row"><input class="num" id="baseAdd" type="text" inputmode="decimal" placeholder="ft"><button class="btn blue" onclick="addList(\'base\',\'baseAdd\')">+ Add run by hand</button></div>');

  h+='<div class="sec"><div class="sec-head"><span class="sec-title">Doors &amp; Windows</span><span class="sec-total" id="tot_dw">'+t.doors+' doors · '+t.wins+' windows</span></div><div class="sec-body">'+
    '<div class="counter"><span class="lbl">Doors</span><button onclick="bump(\'doors\',-1)">−</button><span class="val" id="n_doors">'+t.doors+'</span><button onclick="bump(\'doors\',1)">+</button></div>'+
    '<div class="counter"><span class="lbl">Windows</span><button onclick="bump(\'wins\',-1)">−</button><span class="val" id="n_wins">'+t.wins+'</span><button onclick="bump(\'wins\',1)">+</button></div></div></div>';

  h+='<div class="sec"><div class="sec-head"><span class="sec-title">Notes</span></div><div class="sec-body"><textarea placeholder="Anything about this room" oninput="setNotes(this.value)">'+esc(r.notes)+'</textarea></div></div>'+
     '<div class="foot"><button class="btn sm" style="border-color:var(--red);color:#ff8d80" onclick="deleteRoom()">Delete this room</button></div>';
  return h;
}

document.getElementById('app').addEventListener('click',function(e){
  var s=e.target.closest('.sec[data-key]');
  if(s && state.view==='room' && s.dataset.key!==state.target) setTarget(s.dataset.key);
});

// ───────────────────────── export ─────────────────────────
function buildExport(j){
  var L=[];
  L.push('PAINT MEASUREMENTS');
  L.push('Client: '+(j.client||'(not entered)'));
  L.push('Date: '+dateStr(j.updated));
  L.push('Rooms: '+j.rooms.length);
  L.push('Units: feet. Laser shots are rounded to whole feet.');
  L.push('');
  var T={wallSF:0,ceilSF:0,baseLF:0,doors:0,wins:0};
  j.rooms.forEach(function(r,i){
    var t=roomTotals(r);
    T.wallSF+=t.wallSF;T.ceilSF+=t.ceilSF;T.baseLF+=t.baseLF;T.doors+=t.doors;T.wins+=t.wins;
    L.push('ROOM '+(i+1)+': '+r.name+(r.done?'':' (not marked done)'));
    L.push('  Ceiling height: '+fmt(r.height)+' ft');
    L.push('  Walls: '+(r.walls.length ? r.walls.map(fmt).join(', ')+' ft (perimeter '+fmt(t.per)+' ft)' : 'none'));
    if(r.walls.length) L.push('  Wall area: '+fmt(t.wallSF)+' sf (perimeter x height)');
    L.push('  Ceiling: '+(r.ceil.length ? r.ceil.map(function(c){return fmt(c.l)+' x '+fmt(c.w)+' = '+fmt(c.l*c.w)+' sf';}).join('; ')+(r.ceil.length>1?' (total '+fmt(t.ceilSF)+' sf)':'') : 'none'));
    L.push('  Baseboard: '+(r.base.length ? r.base.map(fmt).join(', ')+' ft (total '+fmt(t.baseLF)+' lf)' : 'none'));
    L.push('  Doors: '+t.doors);
    L.push('  Windows: '+t.wins);
    if(r.notes && r.notes.trim()) L.push('  Notes: '+r.notes.trim().replace(/\n+/g,' '));
    L.push('');
  });
  L.push('JOB TOTALS');
  L.push('  Wall area: '+fmt(T.wallSF)+' sf');
  L.push('  Ceiling area: '+fmt(T.ceilSF)+' sf');
  L.push('  Baseboard: '+fmt(T.baseLF)+' lf');
  L.push('  Doors: '+T.doors+'   Windows: '+T.wins);
  return L.join('\n');
}
function slug(s){ return (s||'job').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'job'; }
function copyText(text){
  function fallback(){ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); toast(ok?'Copied. Paste it into Claude.':'Could not copy','err'); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast('Copied. Paste it into Claude.'); },fallback); else fallback();
}
async function sendToClaude(){
  var j=curJob(), text=buildExport(j);
  if(navigator.share){
    try { await navigator.share({title:'Measurements - '+(j.client||'Job'), text:text}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  copyText(text);
}
function copyExport(){ copyText(buildExport(curJob())); }
async function shareOrDownload(name,mime,content){
  var file; try { file=new File([content],name,{type:mime}); } catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file],title:name}); return; } catch(e){ if(e && e.name==='AbortError') return; }
  }
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:mime})); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
  toast('File saved to Downloads');
}
function saveTxt(){ var j=curJob(); shareOrDownload('measurements-'+slug(j.client)+'-'+new Date().toISOString().slice(0,10)+'.txt','text/plain',buildExport(j)); }
function backupJob(){ var j=curJob(); shareOrDownload('measure-backup-'+slug(j.client)+'-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify({app:'ppm',jobs:[j]},null,1)); }
function backupAll(){ shareOrDownload('measure-backup-all-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify({app:'ppm',jobs:state.jobs},null,1)); }
function restoreFile(inp){
  var f=inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result); if(!d||!Array.isArray(d.jobs)) throw new Error('bad');
      d.jobs.forEach(function(nj){ var i=state.jobs.findIndex(function(x){return x.id===nj.id;}); if(i>=0) state.jobs[i]=nj; else state.jobs.push(nj); });
      save(); render(); toast('Restored '+d.jobs.length+' job(s)');
    }catch(e){ toast('That file is not a Measure backup','err'); }
  };
  rd.readAsText(f); inp.value='';
}

// ───────────────────────── sound ─────────────────────────
function speak(ft){
  if(state.mute || !window.speechSynthesis) return;
  try{ window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(ft+' foot'); u.rate=0.95; window.speechSynthesis.speak(u); }catch(e){}
}
function toggleMute(){ state.mute=!state.mute; save(); document.getElementById('muteBtn').textContent=state.mute?'🔇':'🔊'; }

// ───────────────────────── DISTO D2 Bluetooth (same channel logic as the main PaintPro app) ─────────────────────────
var BLE_CANDIDATES=[
  {svc:'3ab10100-f831-4395-b29d-570977d5bf94',char:'3ab10101-f831-4395-b29d-570977d5bf94'},
  {svc:'6e400001-b5a3-f393-e0a9-e50e24dcca9e',char:'6e400003-b5a3-f393-e0a9-e50e24dcca9e'}
];
var btDevice=null, btConnected=false, userDisc=false, reconnecting=false, lastMeters=0, lastMetersAt=0;
function sleep(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
function setBt(kind,txt){
  var b=document.getElementById('btBtn');
  b.className = kind==='ok'?'ok':kind==='busy'?'busy':kind==='err'?'err':'';
  b.textContent = kind==='ok' ? '📐 Connected' : kind==='busy' ? '📐 …' : '📐 Connect DISTO';
  document.getElementById('btStatus').textContent = txt;
}
function handleBt(){
  if(window.speechSynthesis && !state.mute){ try{ window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){} }
  if(btConnected){ userDisc=true; if(btDevice && btDevice.gatt.connected) btDevice.gatt.disconnect(); btConnected=false; setBt('idle','DISTO disconnected'); }
  else connectBt();
}
async function connectBt(){
  if(!navigator.bluetooth){ setBt('err','Needs Chrome on https'); toast('Bluetooth needs Google Chrome (not Samsung Internet) on https','err'); return; }
  userDisc=false;
  try{
    setBt('busy','Scanning…');
    btDevice = await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'DISTO'},{namePrefix:'Leica'}],
      optionalServices:['3ab10100-f831-4395-b29d-570977d5bf94','6e400001-b5a3-f393-e0a9-e50e24dcca9e','generic_access','device_information','battery_service']
    });
    btDevice.addEventListener('gattserverdisconnected',onDrop);
    setBt('busy','Connecting…');
    await attach();
  }catch(err){
    var f = err.name==='NotFoundError' ? 'No device picked. Try again.' : err.name==='SecurityError' ? 'Blocked. Page needs https.' : (err.message||'Connection failed');
    setBt('err',f); toast(f,'err');
  }
}
async function attach(){
  var server = await btDevice.gatt.connect(), found=false, services=[];
  try{ services = await server.getPrimaryServices(); }catch(e){}
  for(var i=0;i<BLE_CANDIDATES.length && !found;i++){
    try{
      var svc=await server.getPrimaryService(BLE_CANDIDATES[i].svc), ch=await svc.getCharacteristic(BLE_CANDIDATES[i].char);
      if(ch.properties.notify||ch.properties.indicate){ await ch.startNotifications(); ch.addEventListener('characteristicvaluechanged',onMeasurement); found=true; }
    }catch(e){}
  }
  if(!found){
    outer: for(var s=0;s<services.length;s++){
      try{
        var chars=await services[s].getCharacteristics();
        for(var c=0;c<chars.length;c++){
          if(chars[c].properties.notify||chars[c].properties.indicate){
            try{ await chars[c].startNotifications(); chars[c].addEventListener('characteristicvaluechanged',onMeasurement); found=true; break outer; }catch(e){}
          }
        }
      }catch(e){}
    }
  }
  btConnected=true;
  if(found){ setBt('ok',(btDevice.name||'DISTO')+' ready. Press the laser button.'); toast('DISTO connected'); }
  else { setBt('err','Connected but no data channel found'); toast('Connected, but no measurement channel found','err'); }
}
function onDrop(){
  btConnected=false;
  if(userDisc){ setBt('idle','DISTO disconnected'); return; }
  setBt('busy','Connection lost. Reconnecting…');
  tryReconnect();
}
async function tryReconnect(){
  if(reconnecting) return; reconnecting=true;
  for(var n=1;n<=4;n++){
    setBt('busy','Reconnecting '+n+' of 4…'); await sleep(1500);
    try{ await attach(); reconnecting=false; toast('DISTO reconnected'); return; }catch(e){}
  }
  reconnecting=false; setBt('err','DISTO lost. Tap to reconnect.'); toast('DISTO disconnected. Your numbers are saved.','err');
}
// Returns meters, or null. Confirmed D2 format: float32 little-endian, meters.
function parseDisto(dv){
  var m=null, i, f, le;
  if(dv.byteLength>=4){ f=dv.getFloat32(0,true); if(f>0.01&&f<200) m=f; }
  if(m===null && dv.byteLength>=4){ for(i=0;i<=dv.byteLength-4;i++){ f=dv.getFloat32(i,true); if(f>0.01&&f<200){ m=f; break; } } }
  if(m===null && dv.byteLength>=4){
    for(i=0;i<=dv.byteLength-4;i++){
      le=dv.getUint32(i,true);
      if(le>10&&le<200000){ m=le/1000; break; }
      if(le>100&&le<2000000){ m=le/10000; break; }
    }
  }
  if(m===null){
    try{
      var txt=new TextDecoder('utf-8',{fatal:true}).decode(dv.buffer).trim();
      var mM=txt.match(/([\d.]+)\s*m(?!m)/i), mmM=txt.match(/([\d.]+)\s*mm/i), ftM=txt.match(/(\d+)\s*ft\s*([\d.]+)?\s*in?/i);
      if(mM) m=parseFloat(mM[1]); else if(mmM) m=parseFloat(mmM[1])/1000; else if(ftM) m=((parseFloat(ftM[1])||0)*12+(parseFloat(ftM[2])||0))*0.0254;
    }catch(e){}
  }
  return (m && m>0 && m<=200) ? m : null;
}
function onMeasurement(evt){
  var m=parseDisto(evt.target.value);
  if(!m){ toast('Could not read that shot. Shoot again.','warn'); return; }
  var t=Date.now();
  if(m===lastMeters && t-lastMetersAt<300) return; // same notification twice
  lastMeters=m; lastMetersAt=t;
  onShot(m*3.28084);
}

// ───────────────────────── boot ─────────────────────────
load();
if(state.view==='room' && !curRoom()) state.view = curJob() ? 'job' : 'home';
if(state.view==='job' && !curJob()) state.view='home';
render();
var resumed = state.view!=='home';
if(resumed) toast('Back where you left off ✓');
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
window.PPM = {state:function(){return state;}, onShot:onShot, parseDisto:parseDisto, buildExport:buildExport, roomTotals:roomTotals};
</script>
